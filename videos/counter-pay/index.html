    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#s1", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#s2","#s3","#s6"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#s4", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#s5", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — rush→stack (the 40 falls) : cut-the-curve DOWN (cut @17.95)
      tl.to("#s1", { yPercent: 12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 17.61);
      tl.set("#s1", { autoAlpha: 0 }, 17.95);
      tl.fromTo("#s2", { yPercent: -10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 17.95);
      
      // SEAM — stack→meet (the turn rises) : cut-the-curve UP (cut @30.55)
      tl.to("#s2", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 30.21);
      tl.set("#s2", { autoAlpha: 0 }, 30.55);
      tl.fromTo("#s3", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 30.55);
      
      // SEAM — meet→display (into the amount) : zoom-through (cut @40.75)
      tl.to("#s3", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 40.54);
      tl.to("#s3", { autoAlpha: 0, duration: 0.21, ease: "none" }, 40.54);
      tl.set("#s3", { autoAlpha: 0 }, 40.75);
      tl.fromTo("#s4", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 40.75);
      
      // SEAM — display→devices (arrival) : inverse zoom-through (cut @54.35)
      tl.to("#s4", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 54.14);
      tl.to("#s4", { autoAlpha: 0, duration: 0.21, ease: "none" }, 54.14);
      tl.set("#s4", { autoAlpha: 0 }, 54.35);
      tl.fromTo("#s5", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 54.35);
      
      // SEAM — devices→close (conclusion rises) : cut-the-curve UP (cut @67.15)
      tl.to("#s5", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 66.81);
      tl.set("#s5", { autoAlpha: 0 }, 67.15);
      tl.fromTo("#s6", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 67.15);
      
      // </seams:auto>

      // the ground turns to night with s2's "Gone." flood (complete by 28.1 s)
      tl.set("#ground", { backgroundColor: "#f3f5f2" }, 0);
      tl.set("#ground", { backgroundColor: "#0c110f" }, 28.2);

      // Pad the root timeline to the film's full length.
      tl.set({}, {}, 74.5);
