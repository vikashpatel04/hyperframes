  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);

      function waterfall(els, t, opts = {}) {
        let gap = opts.gap ?? 0.09;
        els.forEach((el, i) => {
          const y = i === 0 ? (opts.y0 ?? 80) : (opts.y ?? 48);
          tl.set(el, { opacity: 1, y }, t);
          tl.to(el, { y: 0, duration: i === 0 ? 0.2 : 0.15, ease: "power4.out" }, t);
          t += gap;
          gap *= 0.84;
        });
      }

      // the headline arrives composed inside the retracting seam; nothing grows here

      // ---- the devices arrive on their words ----
      [
        ["#s5-phone", 2.4],
        ["#s5-mon", 3.3],
        ["#s5-eink", 4.5],
      ].forEach(([sel, t]) => {
        tl.set(sel, { opacity: 1, y: 140 }, t);
        tl.to(sel, { y: 0, duration: 0.55, ease: "expo.out" }, t);
      });
      tl.fromTo(".s5-paper .bar", { scaleX: 1 }, { scaleX: 0.8, duration: 9, ease: "none", immediateRender: false }, 2.4);

      // ---- "Works with what you have." (waterfall cut, leftward) ----
      q("#s5-h1 span").forEach((el, i) => {
        tl.to(el, { x: -230, duration: 0.34, ease: "power4.in" }, 5.85 + i * 0.022);
        tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, 5.85 + i * 0.022);
      });
      let off = 0,
        gap = 0.06;
      q("#s5-h2 span").forEach((el) => {
        tl.fromTo(el, { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 6.19 + off);
        off += gap;
        gap *= 0.84;
      });

      // the next customer: one new amount reaches every screen on the same frame
      q(".s5-dev .amt").forEach((amt) => {
        const o = amt.querySelector(".old");
        const n = amt.querySelector(".new");
        tl.to(o, { opacity: 0, filter: "blur(6px)", duration: 0.13, ease: "power2.in" }, 7.6);
        tl.fromTo(n, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", immediateRender: false }, 7.7);
      });

      // ---- custom device? the row steps up, the contact card rises (9.1 – 9.8) ----
      tl.to("#s5-h2", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 9.0);
      tl.to("#s5-row", { scale: 0.62, y: -170, duration: 0.6, ease: "power2.inOut" }, 9.05);
      tl.set("#s5-card", { opacity: 1, y: 160 }, 9.2);
      tl.to("#s5-card", { y: 0, duration: 0.55, ease: "expo.out" }, 9.2);

      window.__timelines["s5"] = tl;
    })();
