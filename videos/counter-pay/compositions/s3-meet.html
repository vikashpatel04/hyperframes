        tl.to(el, { color: to, duration: 0.18, ease: "power2.out" }, qAt[i]);
      });

      // ---- rack-focus: the question blurs away, the 40 becomes the mark (2.75 – 3.2) ----
      tl.to("#s3-q", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 2.75);
      tl.to("#s3-chip", { x: 300 - 1340, y: 360 - 520, scaleX: 300 / 360, scaleY: 300 / 230, transformOrigin: "0 0", filter: "blur(10px)", duration: 0.32, ease: "power3.inOut" }, 2.72);
      tl.set("#s3-chip", { opacity: 0 }, 3.04);
      tl.fromTo("#s3-mark", { opacity: 1, scale: 1.06, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out", immediateRender: false }, 3.04);
      q("#s3-word span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power2.out", immediateRender: false }, 3.35 + i * 0.035);
      });
      tl.set("#s3-word span", { opacity: 0 }, 0);

      // ---- the lockup steps back; the cashier's screen rises (4.2 – 4.8) ----
      tl.to("#s3-lock", { opacity: 0, scale: 0.92, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 4.42);
      tl.set("#s3-win", { opacity: 1, y: 160 }, 4.55);
      tl.to("#s3-win", { y: 0, duration: 0.5, ease: "expo.out" }, 4.55);

      // ---- F9: the pill rises from the bottom of the screen ----
      tl.set("#s3-f9", { opacity: 1, y: 40 }, 4.9);
      tl.to("#s3-f9", { y: 0, duration: 0.2, ease: "power4.out" }, 4.9);
      tl.to("#s3-f9", { y: 14, boxShadow: "0 0 0 #c9cfcb, 0 14px 30px rgb(0 0 0 / 40%)", duration: 0.06, ease: "power2.in" }, 5.2);

      tl.to("#s3-f9", { opacity: 0, x: 120, duration: 0.2, ease: "power3.in" }, 5.6);

      // punch in on the pill while the amount is typed, back out as it is sent

      tl.to("#s3-stage", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 7.85);

      // ---- 1-0-4-0 typed on "type the amount" ----
      const typed = ["#s3-a1", "#s3-a2", "#s3-a3", "#s3-a4"];
      typed.forEach((id, i) => {
        const t = 5.66 + i * 0.15;
        tl.set(i === 0 ? "#s3-ph" : typed[i - 1], { opacity: 0 }, t);
        tl.set(id, { opacity: 1 }, t);
      });

      // ---- Enter: the green floods out of the ₹ circle ----
      tl.set("#s3-enter", { opacity: 1, x: -120 }, 6.55);
      tl.to("#s3-enter", { x: 0, duration: 0.22, ease: "power4.out" }, 6.55);
      tl.to("#s3-enter", { y: 14, boxShadow: "0 0 0 #c9cfcb, 0 14px 30px rgb(0 0 0 / 40%)", duration: 0.06, ease: "power2.in" }, 6.92);
      tl.to("#s3-enter", { y: 0, boxShadow: "0 14px 0 #c9cfcb, 0 30px 50px rgb(0 0 0 / 40%)", duration: 0.18, ease: "power2.out" }, 6.98);
      tl.set("#s3-flood", { opacity: 1, scale: 1 }, 6.98);
      tl.to("#s3-flood", { scale: 24, duration: 0.34, ease: "power3.inOut" }, 6.98);
      tl.to("#s3-glyph", { backgroundColor: "rgba(255,255,255,0.2)", color: "#ffffff", duration: 0.2 }, 7.1);

      tl.set("#s3-sent", { opacity: 1 }, 7.18);
      tl.to("#s3-enter", { opacity: 0, x: 120, duration: 0.2, ease: "power3.in" }, 7.3);
