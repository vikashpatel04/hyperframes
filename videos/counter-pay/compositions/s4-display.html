  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);

      function waterfall(els, t, opts = {}) {
        let gap = opts.gap ?? 0.09;
        els.forEach((el, i) => {
          const y = i === 0 ? (opts.y0 ?? 80) : (opts.y ?? 48);
          tl.set(el, { opacity: 1, y }, t);
          tl.to(el, { y: 0, duration: i === 0 ? 0.2 : 0.15, ease: "power4.out" }, t);
          t += gap;
          gap *= 0.84;
        });
      }
      function clearK(sel, t) {
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, t);
      }

      gsap.set("#s4-cam", { x: 0, y: 0, scale: 1 });
      gsap.set("#s4-qr", { clipPath: "inset(0% 0% 100% 0%)" });
      gsap.set("#s4-fixed-bar", { scaleX: 0 });

      // the QR draws itself on "sees a QR"
      tl.fromTo("#s4-qr", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: "power2.inOut", immediateRender: false }, 0.2);

      // ₹1,040 lands on "one thousand and forty"
      waterfall(q("#s4-amount .num span"), 2.95, { y0: 70, y: 46, gap: 0.06 });
      tl.fromTo(".s4-hint", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 3.35);
      tl.set(".s4-h2 span[lang=hi]", { opacity: 1 }, 3.35);
      tl.fromTo(".s4-payee", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 3.5);
      // the QR's own timer runs down: the product behaving
      tl.fromTo("#s4-expiry", { scaleX: 1 }, { scaleX: 0.86, duration: 10.1, ease: "none", immediateRender: false }, 3.5);

      // ---- Amount fixed. ----
      tl.set("#s4-lock", { opacity: 1, scale: 0.4 }, 4.12);
      tl.to("#s4-lock", { scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 4.12);
      tl.to("#s4-fixed-bar", { scaleX: 1, duration: 0.35, ease: "power3.out" }, 4.2);
      tl.to("#s4-fixed", { color: "#0b7a55", duration: 0.2 }, 4.2);
      waterfall(q("#s4-k1 span"), 4.12, { y0: 70, y: 70, gap: 0.3 });
      clearK("#s4-k1", 5.4);

      // ---- your own standee QR → your account ----
      tl.set("#s4-standee", { opacity: 1, x: 260 }, 5.6);
      tl.to("#s4-standee", { x: 0, duration: 0.55, ease: "expo.out" }, 5.6);
      waterfall(q("#s4-k2 span"), 6.25, { y0: 60, y: 60, gap: 0.2 });
      // the standee's payee leaves it and flies into the screen's PAYING row
      tl.set("#s4-chip", { opacity: 1, scale: 0.6 }, 7.5);
      tl.to("#s4-chip", { scale: 1, duration: 0.25, ease: "power4.out" }, 7.5);
      tl.to("#s4-chip", { x: 805 - 1475, y: 690 - 850, scale: 0.72, duration: 0.55, ease: "power3.inOut" }, 8.0);
      tl.set("#s4-chip", { opacity: 0 }, 8.55);
      tl.fromTo("#s4-payname", { backgroundColor: "rgba(20,179,125,0.45)" }, { backgroundColor: "rgba(20,179,125,0)", duration: 0.9, ease: "power2.out", immediateRender: false }, 8.55);
      clearK("#s4-k2", 9.15);
      tl.to("#s4-standee", { x: 300, opacity: 0, duration: 0.3, ease: "power3.in" }, 9.1);

      // ---- Every rupee. ----
      waterfall(q("#s4-k3 span"), 9.42, { y0: 70, y: 70, gap: 0.28 });
      clearK("#s4-k3", 10.55);

      // ---- languages: push in on the hint lines, the second line rolls through scripts ----
      tl.to("#s4-cam", { x: 700 - 1.55 * 1014, y: 560 - 1.55 * 600, scale: 1.55, duration: 0.6, ease: "power2.inOut" }, 10.6);
      const langs = q(".s4-h2 span");
      const rollAt = [11.2, 11.75, 12.3, 12.85];
      rollAt.forEach((t, i) => {
        tl.to(langs[i], { opacity: 0, y: -16, filter: "blur(4px)", duration: 0.1, ease: "power2.in" }, t);
        tl.fromTo(langs[i + 1], { opacity: 0, y: 16, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.13, ease: "power2.out", immediateRender: false }, t + 0.08);
      });
      waterfall(q("#s4-k4 span"), 10.85, { y0: 70, y: 56, gap: 0.22 });

      window.__timelines["s4"] = tl;
    })();
  </script>
