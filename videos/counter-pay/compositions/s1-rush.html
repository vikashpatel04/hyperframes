  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);
      const F = 1 / 30;

      // camera: centre world point (px, py) at scale s
      const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
      gsap.set("#s1-cam", { x: 0, y: 0, scale: 1 });

      // a nudge curve on the camera: ramp 20% / burst 18% / tail 62% of the time
      function nudge(from, to, t, dur) {
        const lerp = (k) => ({
          x: from.x + (to.x - from.x) * k,
          y: from.y + (to.y - from.y) * k,
          scale: from.scale + (to.scale - from.scale) * k,
        });
        tl.to("#s1-cam", { ...lerp(0.1), duration: dur * 0.2, ease: "power3.in" }, t);
        tl.to("#s1-cam", { ...lerp(0.75), duration: dur * 0.18, ease: "none" }, t + dur * 0.2);
        tl.to("#s1-cam", { ...lerp(1), duration: dur * 0.62, ease: "power4.out" }, t + dur * 0.38);
      }

      // waterfall entry: binary reveal, whip up from below, gaps shrink
      function waterfall(els, t, opts = {}) {
        let gap = opts.gap ?? 0.09;
        els.forEach((el, i) => {
          const y = i === 0 ? (opts.y0 ?? 80) : (opts.y ?? 48);
          tl.set(el, { opacity: 1, y }, t);
          tl.to(el, { y: 0, duration: i === 0 ? 0.2 : 0.15, ease: "power4.out" }, t);
          t += gap;
          gap *= 0.84;
        });
      }

      // per-word grey → ink, no movement
      function inkIn(els, t, step = 0.08, color = "#0f1513") {
        els.forEach((el, i) => {
          tl.set(el, { opacity: 1, color: "#b8c0bb" }, t + i * step);
          tl.to(el, { color, duration: 0.18, ease: "power2.out" }, t + i * step);
        });
      }

      // ---------- station 1: RUSH HOUR (0 – 2.6) ----------
      // on screen from frame 0 (the thumbnail), already whipping up into place
      tl.fromTo("#s1-t1", { opacity: 1, y: 90 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, 0);
      tl.fromTo("#s1-t2", { opacity: 1, y: 120 }, { opacity: 1, y: 0, duration: 0.34, ease: "power4.out" }, 0.04);

      // the queue streams in from the door, front of the line first
      tl.fromTo("#s1-door", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.1);
      q("#s1-queue .s1-person").forEach((p, i) => {
        const t = 1.2 + i * 0.07;
        tl.set(p, { opacity: 1, x: 180, y: 30 }, t);
        tl.to(p, { x: 0, y: 0, duration: 0.42, ease: "power4.out" }, t);
      });
      inkIn(q("#s1-sub span"), 0.85, 0.1);

      // ---------- pan to the counter (2.5 – 3.25) ----------
      const A = { x: 0, y: 0, scale: 1 };
      const B = { x: -1920, y: 0, scale: 1 };
      nudge(A, B, 2.62, 0.8);
