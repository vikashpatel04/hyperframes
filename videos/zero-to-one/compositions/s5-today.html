  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => [...document.querySelectorAll(s)];
      const T0 = 45.0;
      const at = (t) => t - T0;

      const WEIGHT = { anchor: [72, 0.19], word: [46, 0.15], light: [34, 0.12] };
      function arrive(el, t, kind = "word") {
        const [dy, dur] = WEIGHT[kind];
        tl.set(el, { opacity: 1 }, at(t));
        tl.fromTo(el, { y: dy, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: dur, ease: "power4.out", immediateRender: false }, at(t));
      }
      function writeOn(el, t, dur) {
        tl.set(el, { opacity: 1 }, at(t));
        tl.fromTo(el, { clipPath: "inset(-40% 100% -40% -8%)" }, { clipPath: "inset(-40% -8% -40% -8%)", duration: dur, ease: "none", immediateRender: false }, at(t));
      }
      function cutLeft(els, t) {
        els.forEach((el, i) => {
          tl.to(el, { x: -230, duration: 0.34, ease: "power4.in" }, at(t) + i * 0.022);
          tl.to(el, { opacity: 0, duration: 0.18, ease: "none" }, at(t) + i * 0.022);
        });
      }
      function nudge(el, t, prop, dist, dur) {
        tl.to(el, { [prop]: `+=${dist * 0.1}`, duration: dur * 0.2, ease: "power3.in" }, at(t));
        tl.to(el, { [prop]: `+=${dist * 0.65}`, duration: dur * 0.18, ease: "none" }, at(t) + dur * 0.2);
        tl.to(el, { [prop]: `+=${dist * 0.25}`, duration: dur * 0.62, ease: "power4.out" }, at(t) + dur * 0.38);
      }
      // a split-flap tile riffles through a few values (by index) and lands on the last on cue
      function flap(id, seq, land) {
        const s = q(`${id} span`);
        for (let i = 1; i < seq.length; i++) {
          const t = land - (seq.length - 1 - i) * 0.055;
          tl.set(s[seq[i - 1]], { opacity: 0 }, at(t));
          tl.set(s[seq[i]], { opacity: 1 }, at(t));
          tl.fromTo(id, { scaleY: 0.55 }, { scaleY: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, at(t));
        }
      }
      // swap a label for its replacement in place
      function swap(el, t) {
        tl.set(el.querySelector(".a"), { opacity: 0 }, at(t));
        tl.set(el.querySelector(".z"), { opacity: 1 }, at(t));
      }

      gsap.set(".h-cap", { transformOrigin: "0% 50%" });
      gsap.set("#h-mini", { rotation: 3 });
      gsap.set("#h-sheet", { y: 1000 });

      // ---------------------------------------------------------------- then into today
      const capA = q("#h-capA > span");
      arrive(capA[0], 45.08, "word");
      arrive(capA[1], 45.28, "light");
      writeOn(capA[2], 45.61, 0.32);
      cutLeft(capA, 46.16);
      tl.set("#h-title", { opacity: 1 }, at(46.3));
      tl.fromTo("#h-title", { y: 72, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.19, ease: "power4.out", immediateRender: false }, at(46.3));
      tl.set("#h-sub", { opacity: 1 }, at(46.42));
      tl.fromTo("#h-sub", { y: 34 }, { y: 0, duration: 0.14, ease: "power4.out", immediateRender: false }, at(46.42));
      tl.set("#h-mini", { opacity: 1 }, at(46.5));
      tl.fromTo("#h-mini", { scale: 1.3, rotation: -6 }, { scale: 1, rotation: 3, duration: 0.2, ease: "power4.out", immediateRender: false }, at(46.5));

      // Monday, nine A.M. Twenty-five minutes. JavaScript basics.
      flap("#h-f1", [0, 1, 2, 3, 4], 46.34);
      flap("#h-f2", [0, 1, 2, 3, 4], 46.68);
      tl.set("#h-f2", { boxShadow: "inset 0 0 0 3px #f97316" }, at(46.7));
      flap("#h-f3", [0, 1, 2, 3, 4], 47.59);
      tl.to("#h-h2sk", { opacity: 0, duration: 0.08 }, at(48.76));
      const h2 = q("#h-h2 span");
      arrive(h2[0], 48.81, "anchor");
      arrive(h2[1], 49.55, "word");
      tl.to("#h-start", { scale: 1.07, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at(49.9));

      // ---------------------------------------------------------------- miss a day? the plan moves. nothing piles up.
      cutLeft(["#h-title", "#h-sub"], 50.36);
      tl.to("#h-mini", { opacity: 0, duration: 0.2, ease: "none" }, at(50.36));
      tl.to("#h-list", { x: -230, duration: 0.34, ease: "power4.in" }, at(50.4));
