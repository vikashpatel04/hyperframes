      const q = (s) => [...document.querySelectorAll(s)];

      const at = (t) => t - T0;

      const WEIGHT = { anchor: [72, 0.19], word: [46, 0.15], light: [34, 0.12] };
      function arrive(el, t, kind = "word") {
        const [dy, dur] = WEIGHT[kind];
        tl.set(el, { opacity: 1 }, at(t));
        tl.fromTo(el, { y: dy, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: dur, ease: "power4.out", immediateRender: false }, at(t));
      }
      function pushOut(sel, t) {
        tl.to(sel, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, at(t));
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, at(t));
      }

      const note = document.getElementById("e-note");
      note.append(document.getElementById("e-card"), document.getElementById("e-mark"));

      // ---- the room as Act 1 left it: Day 1,095, the note underlined, the wall a little soft

      gsap.set("#e-counter", { opacity: 1 });
      gsap.set("#e-note", { rotation: -3.5 });
      gsap.set(["#e-ul1", "#e-ul2"], { attr: { "stroke-dashoffset": 0 } });
