    <div id="d-cap1" class="d-cap d-abs" style="font-size: 100px"><span class="m">Underneath</span> <span class="m">all</span> <span class="m">of</span> <span class="m">it,</span><br /><span>one</span> <span class="d-hl"><i></i><b>note.</b></span></div>
    <div id="d-cap2" class="d-cap d-abs" style="font-size: 124px"><span>Three</span> <span>years</span><br /><span id="d-old">old.</span></div>
    <div id="d-cap4" class="d-cap d-abs" style="font-size: 72px"><span class="m">It</span> <span class="m">says:</span> <span class="d-hw">become</span> <span class="d-hw">a</span><br /><span class="d-hw">software</span> <span class="d-hw d-eng">engineer.<svg viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><path id="d-cul1" d="M4 12 C 80 6, 200 4, 296 9" fill="none" stroke="#2a2520" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" /><path id="d-cul2" d="M16 30 C 100 24, 200 22, 286 27" fill="none" stroke="#2a2520" stroke-width="4.5" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" /></svg></span></div>
    <div id="d-cap3" class="d-cap d-abs" style="font-size: 96px"><span>Every</span> <span>morning,</span><br /><span class="m">the</span> <span>same</span> <span class="m">question</span><span class="m">.</span><span class="m">.</span><span class="m">.</span></div>
    <div id="d-cap5" class="d-cap d-abs" style="font-size: 88px"><span class="m">What</span> <span class="m">do</span> <span class="m">I</span><br /><span class="d-ital">actually</span> <span class="m">do</span> <span class="d-today"><b>today?</b><svg viewBox="0 0 300 150" preserveAspectRatio="none" aria-hidden="true"><path id="d-tring" d="M44 84 C 40 34, 140 14, 222 22 C 292 30, 298 112, 222 130 C 150 146, 40 138, 30 96 C 24 64, 72 34, 124 28" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" /></svg></span></div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => [...document.querySelectorAll(s)];
      const F = 1 / 30;

      // ---- the type system (kinetic, on the voice) ----
      // narrator words arrive from below on their cue (waterfall entry: binary opacity, power4.out),
      // travel and time scaled by weight; a light 6px blur sells the speed
      const WEIGHT = { anchor: [72, 0.19], word: [46, 0.15], light: [34, 0.12] };
      function arrive(el, t, kind = "word") {
        const [dy, dur] = WEIGHT[kind];
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { y: dy, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: dur, ease: "power4.out", immediateRender: false }, t);
      }
      // Riya's words are written on, left to right, at handwriting speed
      function writeOn(el, t, dur) {
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { clipPath: "inset(-40% 100% -40% -8%)" }, { clipPath: "inset(-40% -8% -40% -8%)", duration: dur, ease: "none", immediateRender: false }, t);
      }
      // a caption leaves the way the camera moves: pushed past the lens (zoom-through exit)
      function pushOut(sel, t) {
        tl.to(sel, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, t);
      }

      // ---------------------------------------------------------------- set-up
      gsap.set("#d-cam", { scale: 1, x: 0, y: 0, rotation: 0 });
      gsap.set("#d-note", { rotation: -3.5 });
      gsap.set("#d-note2", { rotation: 3 });
      gsap.set(["#d-notetxt", "#d-underline"], { filter: "blur(5px)" });
      gsap.set("#d-crack", { clipPath: "circle(0px at 975px 690px)" });
      gsap.set(["#d-n2a", "#d-n2b"], { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(".d-cap", { transformOrigin: "0% 50%" });
      gsap.set(".d-hl i", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(".d-ital", { skewX: -10 });

      // the eight notifications: final rotations, landing times (each gap shorter)
      const cards = [
        ["#d-n1", 5, 0.0],
        ["#d-n2", -4, 0.3],
        ["#d-n3", 3, 0.56],
        ["#d-n4", -6, 0.79],
        ["#d-n5", 7, 0.99],
        ["#d-n6", -3, 1.16],
        ["#d-n7", -8, 1.31],
        ["#d-n8", 9, 1.44],
      ];

      // ---------------------------------------------------------------- HOOK: the avalanche (0 – 2.0)
      cards.forEach(([id, rot, t], i) => {
        const fall = 0.3;
        // frame 0 already has the first card mid-drop
        const from = i === 0 ? { opacity: 1, y: -260, rotation: rot - 6 } : { opacity: 1, y: -1300, rotation: rot - 14 };
        tl.fromTo(id, from, { opacity: 1, y: 14, rotation: rot + 1, duration: i === 0 ? 0.18 : fall, ease: "power2.in", immediateRender: i === 0 }, t);
        tl.to(id, { y: 0, rotation: rot, duration: 0.2, ease: "back.out(2.2)" }, t + (i === 0 ? 0.18 : fall));
        // each landing jolts the camera a little
        tl.to("#d-cam", { y: 5, duration: 0.04, ease: "power2.out" }, t + (i === 0 ? 0.18 : fall));
        tl.to("#d-cam", { y: 0, duration: 0.12, ease: "power2.out" }, t + (i === 0 ? 0.22 : fall + 0.04));
      });
      // tension: the camera creeps in
      tl.fromTo("#d-cam", { scale: 1 }, { scale: 1.035, duration: 2.0, ease: "power1.in", immediateRender: false }, 0);
      // the badge counts up, popping on every change
      const badgeAt = [0.05, 0.45, 0.72, 0.95, 1.14, 1.3, 1.46, 1.62, 1.8];
      const bvals = q("#d-badge span");
      tl.set("#d-badge", { opacity: 1 }, 0.05);
      bvals.forEach((b, i) => {
        if (i) tl.set(bvals[i - 1], { opacity: 0 }, badgeAt[i]);
        tl.set(b, { opacity: 1 }, badgeAt[i]);
        tl.fromTo("#d-badge", { scale: i === bvals.length - 1 ? 1.45 : 1.22 }, { scale: 1, duration: 0.14, ease: "back.out(2)", immediateRender: false }, badgeAt[i]);
      });

      // ---------------------------------------------------------------- THE CRACK (2.0)
      const C = 2.0;
      tl.set("#d-flash", { opacity: 1 }, C);
      tl.to("#d-flash", { opacity: 0, duration: 0.32, ease: "power2.out" }, C + F);
      tl.to("#d-crack", { clipPath: "circle(1500px at 975px 690px)", duration: 0.22, ease: "power3.out" }, C);
      tl.set("#d-redvig", { opacity: 1 }, C);
      const shake = [
        [0, 14, -10, -1.8],
        [0.033, -11, 9, -0.6],
        [0.066, 9, -6, -1.6],
        [0.1, -5, 4, -1.0],
        [0.15, 2, -2, -1.3],
        [0.2, 0, 0, -1.2],
      ];
      shake.forEach(([dt, x, y, r]) => tl.set("#d-cam", { x, y, rotation: r }, C + dt));
      tl.to("#d-cam", { scale: 1.07, duration: 0.12, ease: "power4.out" }, C);
      // red / cyan colour split on every card
      tl.set(".d-ntf", { boxShadow: "-11px 0 0 rgba(255,30,70,0.5), 11px 0 0 rgba(0,200,255,0.5), 0 18px 40px rgba(0,0,0,0.28)" }, C);

      // ---------------------------------------------------------------- THE FREEZE-FRAME (2.3 – 6.0)
      tl.fromTo("#d-look", { filter: "grayscale(0) sepia(0) contrast(1)" }, { filter: "grayscale(0.9) sepia(0.35) contrast(1.08)", duration: 0.25, ease: "power2.out", immediateRender: false }, 2.3);
      tl.to("#d-crack", { opacity: 0.75, duration: 0.25 }, 2.3);
      tl.to("#d-redvig", { opacity: 0, duration: 0.3 }, 2.3);
      tl.to("#d-grain", { opacity: 0.16, duration: 0.2 }, 2.3);
      tl.to("#d-circ", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 2.42);
      tl.to("#d-arrow", { attr: { "stroke-dashoffset": 0 }, duration: 0.24, ease: "power2.in" }, 2.88);
      tl.to("#d-head", { attr: { "stroke-dashoffset": 0 }, duration: 0.1, ease: "none" }, 3.12);

      // meme captions on the voice
      const m1 = q("#d-meme1 span");
      // each word is slapped on like a sticker: oversized, a little crooked, then flat
      const tilt1 = [-2.5, 1.5, -1.5, 2];
      [2.78, 2.96, 3.21, 3.53].forEach((t, i) => {
        tl.set(m1[i], { opacity: 1 }, t);
        tl.fromTo(m1[i], { scale: 1.5, rotation: tilt1[i] * 3 }, { scale: 1, rotation: tilt1[i], duration: 0.11, ease: "power4.out", immediateRender: false }, t);
      });
      pushOut("#d-meme1", 4.56);
      const m2 = q("#d-meme2 span");
      const tilt2 = [-3, 1.5, -1];
      [4.76, 4.95, 5.27].forEach((t, i) => {
        tl.set(m2[i], { opacity: 1 }, t);
        tl.fromTo(m2[i], { scale: 1.5, rotation: tilt2[i] * 3 }, { scale: 1, rotation: tilt2[i], duration: 0.11, ease: "power4.out", immediateRender: false }, t);
      });
      tl.to("#d-everyp", { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power2.out" }, 4.86);

      // ---------------------------------------------------------------- RELEASE: colour returns, the pile falls away (6.0 – 7.0)
      const R = 6.02;
      pushOut("#d-meme2", R - 0.02);
      tl.to("#d-look", { filter: "grayscale(0) sepia(0) contrast(1)", duration: 0.35, ease: "power2.inOut" }, R);
      tl.to(["#d-crack", "#d-mark"], { opacity: 0, duration: 0.25, ease: "power2.in" }, R);
      tl.to("#d-grain", { opacity: 0.06, duration: 0.3 }, R);
      tl.set(".d-ntf", { boxShadow: "0 2px 4px rgba(0,0,0,0.12), 0 18px 40px rgba(0,0,0,0.28)" }, R);
      tl.to("#d-badge", { scale: 0, duration: 0.2, ease: "back.in(2)" }, R + 0.05);
      [...cards].reverse().forEach(([id, rot], i) => {
        tl.to(id, { y: "+=1500", rotation: rot + (i % 2 ? -38 : 34), duration: 0.6, ease: "power3.in" }, R + 0.12 + i * 0.045);
      });
      tl.to("#d-cam", { scale: 1, x: 0, y: 0, rotation: 0, duration: 0.85, ease: "power2.inOut" }, R + 0.1);
      // off the bottom of the frame, the fallen pile is gone for good
      tl.set(cards.map(([id]) => id), { opacity: 0 }, R + 0.12 + 7 * 0.045 + 0.6);

      // ---------------------------------------------------------------- ACT 1: one note (7.0 – 8.7)
      const cap1 = q("#d-cap1 > span");
      arrive(cap1[0], 7.1, "word");
      arrive(cap1[1], 7.58, "light");
      arrive(cap1[2], 7.76, "light");
      arrive(cap1[3], 7.88, "light");
      arrive(cap1[4], 8.12, "anchor");
      // "note." lands in her handwriting, then a sticky-note highlighter swipes under it
      tl.set(cap1[5], { opacity: 1 }, 8.3);
      tl.fromTo(cap1[5], { scale: 1.35, rotation: -6 }, { scale: 1, rotation: -2, duration: 0.2, ease: "power4.out", immediateRender: false }, 8.3);
      tl.to("#d-cap1 .d-hl i", { scaleX: 1, duration: 0.24, ease: "power2.out" }, 8.38);
      // rack focus: the note snaps sharp as the wall falls soft
      tl.to(["#d-notetxt", "#d-underline"], { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 8.12);
      tl.fromTo("#d-bg", { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.4, ease: "power2.out", immediateRender: false }, 8.12);
      tl.to("#d-cam", { scale: 1.06, transformOrigin: "320px 1180px", duration: 2.2, ease: "power2.inOut" }, 7.0);

      // ---------------------------------------------------------------- Three years old: the time-lapse (9.0 – 11.2)
      pushOut("#d-cap1", 8.98);
      const cap2 = q("#d-cap2 > span");
      // "Three years" rolls in like the counter's wheels: stretched, blurred, a mechanical overshoot
      [9.19, 9.3].forEach((t, i) => {
        tl.set(cap2[i], { opacity: 1 }, t);
        tl.fromTo(cap2[i], { y: 96, scaleY: 1.35, filter: "blur(8px)" }, { y: 0, scaleY: 1, filter: "blur(0px)", duration: 0.24, ease: "back.out(1.7)", immediateRender: false }, t);
      });
      arrive(cap2[2], 9.82, "anchor");
      // and "old." ages while the years run past: the ink fades, the word slackens
      tl.to("#d-old", { color: "#8a7252", scaleX: 1.05, transformOrigin: "0% 50%", duration: 1.1, ease: "power1.inOut" }, 10.0);
      tl.fromTo("#d-counter", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 9.12);
      // the sun sweeps across the wall, morning after morning; the date flips; the mug comes and goes
      const dates = q("#d-date span");
      for (let k = 0; k < 4; k++) {
        const t = 9.3 + k * 0.42;
        tl.fromTo("#d-sunin", { x: -180 }, { x: 260, duration: 0.42, ease: "none", immediateRender: false }, t);
        tl.set("#d-mug", { opacity: k % 2 ? 1 : 0 }, t);
      }
      // the date page flips through the years: one date on screen at a time
      for (let j = 0; j < dates.length - 2; j++) {
        const t = 9.3 + j * 0.28;
        tl.set(dates[j], { opacity: 0 }, t);
        tl.set(dates[j + 1], { opacity: 1 }, t);
      }
      tl.set("#d-sunin", { x: 0 }, 11.0);
      tl.set(dates.slice(0, -1), { opacity: 0 }, 11.0);
      tl.set(dates[dates.length - 1], { opacity: 1 }, 11.0);
      tl.set("#d-mug", { opacity: 1 }, 11.0);

      // the odometer: 1 → 1,095, digits rolling with blur tied to their real speed
      const strips = [q("#d-s0")[0], q("#d-s1")[0], q("#d-s2")[0], q("#d-s3")[0]];
      const blurs = [document.getElementById("d-vbs0"), document.getElementById("d-vbs1"), document.getElementById("d-vbs2")];
      const H = 66,
        V0 = 1,
        V1 = 1095,
        T0 = 9.25,
        DUR = 1.65;
      function renderOdo(v, speed) {
        for (let i = 0; i < 4; i++) {
          const p = Math.pow(10, i);
          let pos;
          if (i === 0) pos = v % 10;
          else {
            const lower = v % p;
            pos = Math.floor(v / p) % 10 + Math.max(0, lower - (p - 1));
          }
          strips[i].style.transform = `translateY(${-pos * H}px)`;
          if (i < 3) blurs[i].setAttribute("stdDeviation", `0 ${Math.min(10, (speed / p) * 0.05).toFixed(2)}`);
        }
      }
      const odo = { p: 0 };
      renderOdo(V0, 0);
      tl.fromTo(
        odo,
        { p: 0 },
        {
          p: 1,
          duration: DUR,
          ease: "none",
          immediateRender: false,
          onUpdate() {
            const p = odo.p;
            const f = p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p);
            const df = p < 0.5 ? 4 * p : 4 * (1 - p);
            renderOdo(V0 + (V1 - V0) * f, ((V1 - V0) * df) / DUR);
          },
        },
        T0,
      );
      // a mechanical landing: the units wheel overshoots and settles
      const land = { o: 0 };
      tl.fromTo(
        land,
        { o: 0 },
        {
          o: 1,
          duration: 0.3,
          ease: "none",
          immediateRender: false,
          onUpdate() {
            const k = land.o;
            const over = Math.sin(k * Math.PI) * 0.16 * (1 - k);
            renderOdo(V1 + over, 0);
          },
        },
        T0 + DUR,
      );

      // ---------------------------------------------------------------- It says: become a software engineer (11.6 – 13.7)
      pushOut("#d-cap2", 11.45);
      tl.to("#d-cam", { scale: 1.12, duration: 2.0, ease: "power2.inOut" }, 11.55);
      const cap4 = q("#d-cap4 > span");
      arrive(cap4[0], 11.68, "light");
      arrive(cap4[1], 11.74, "word");
      // her words: written on in the caption, and answered on the note itself as they are spoken
      const nw = q(".d-nw");
      [
        [12.08, 0.3],
        [12.48, 0.08],
        [12.53, 0.4],
        [13.04, 0.32],
      ].forEach(([t, d], i) => {
        writeOn(cap4[i + 2], t, d);
        tl.to(nw[i], { scale: 1.14, duration: 0.12, ease: "power2.out" }, t);
        tl.to(nw[i], { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.12);
      });
      // the double underline, on the note and in the caption at once
      tl.to(["#d-ul1", "#d-cul1"], { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, 13.38);
      tl.to(["#d-ul2", "#d-cul2"], { attr: { "stroke-dashoffset": 0 }, duration: 0.18, ease: "power2.out" }, 13.54);
      pushOut("#d-cap4", 14.06);

      // ---------------------------------------------------------------- the same question (14.3 – 18.5)
      const cap3 = q("#d-cap3 > span");
      arrive(cap3[0], 14.46, "word");
      arrive(cap3[1], 14.79, "anchor");
      arrive(cap3[2], 15.37, "light");
      arrive(cap3[3], 15.45, "anchor");
      arrive(cap3[4], 15.71, "word");
      // the dots type themselves out
      [15.98, 16.12, 16.26].forEach((t, k) => arrive(cap3[5 + k], t, "light"));
      tl.to("#d-cam", { scale: 1.08, transformOrigin: "460px 1300px", duration: 1.2, ease: "power2.inOut" }, 14.2);
      tl.fromTo("#d-note2", { opacity: 1, y: -90, scale: 1.12, rotation: -4 }, { opacity: 1, y: 0, scale: 1, rotation: 3, duration: 0.3, ease: "power4.out", immediateRender: false }, 14.38);
      pushOut("#d-cap3", 16.72);
      // the question writes itself, then "today" gets circled
      tl.to("#d-n2a", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "none" }, 16.86);
      tl.to("#d-n2b", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.62, ease: "none" }, 17.58);
      // the question, big, for sound-off: "actually" leans, "today?" is hers, in the accent
      const cap5 = q("#d-cap5 > span");
      arrive(cap5[0], 16.9, "word");
      arrive(cap5[1], 17.1, "light");
      arrive(cap5[2], 17.3, "light");
      arrive(cap5[3], 17.34, "anchor");
      arrive(cap5[4], 17.97, "light");
      tl.set(cap5[5], { opacity: 1 }, 18.13);
      writeOn("#d-cap5 .d-today b", 18.13, 0.3);
      // "today" gets circled, on the note and in the caption at once (the accent's first appearance)
      tl.to(["#d-ringp", "#d-tring"], { attr: { "stroke-dashoffset": 0 }, duration: 0.36, ease: "power2.inOut" }, 18.42);

      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
