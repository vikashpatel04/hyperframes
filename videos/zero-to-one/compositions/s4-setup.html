    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => [...document.querySelectorAll(s)];
      const T0 = 37.3;
      const at = (t) => t - T0;

      const WEIGHT = { anchor: [72, 0.19], word: [46, 0.15], light: [34, 0.12] };
      function arrive(el, t, kind = "word") {
        const [dy, dur] = WEIGHT[kind];
        tl.set(el, { opacity: 1 }, at(t));
        tl.fromTo(el, { y: dy, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: dur, ease: "power4.out", immediateRender: false }, at(t));
      }
      // a group leaves upward, word by word (waterfall cut)
      function cutUp(els, t) {
        els.forEach((el, i) => {
          tl.to(el, { y: -160, duration: 0.3, ease: "power4.in" }, at(t) + i * 0.018);
          tl.to(el, { opacity: 0, duration: 0.16, ease: "none" }, at(t) + i * 0.018);
        });
      }
      function pick(sel, t) {
        tl.to(sel, { backgroundColor: "#fff7ed", borderColor: "#f97316", color: "#c2410c", duration: 0.12, ease: "power2.out" }, at(t));
        tl.fromTo(sel, { scale: 1.12 }, { scale: 1, duration: 0.22, ease: "back.out(2.4)", immediateRender: false }, at(t));
      }
      // the three-phase nudge: barely moves, bursts, creeps to rest
      function nudge(el, t, prop, dist, dur) {
        tl.to(el, { [prop]: `+=${dist * 0.1}`, duration: dur * 0.2, ease: "power3.in" }, at(t));
        tl.to(el, { [prop]: `+=${dist * 0.65}`, duration: dur * 0.18, ease: "none" }, at(t) + dur * 0.2);
        tl.to(el, { [prop]: `+=${dist * 0.25}`, duration: dur * 0.62, ease: "power4.out" }, at(t) + dur * 0.38);

      gsap.set(".f-cap", { transformOrigin: "0% 50%" });

      gsap.set("#f-mini", { rotation: -2.5 });

      // ---------------------------------------------------------------- she tells it the goal (from the note)
      const capA = q("#f-capA > span");

        [37.88, "light"],
        [38.04, "anchor"],
        [38.5, "light"],
        [38.69, "light"],
        [38.95, "anchor"],
        [39.61, "light"],
        [39.75, "anchor"],
        [40.23, "light"],
        [40.43, "word"],
        [40.86, "light"],
      ].forEach(([t, k], i) => arrive(capA[i], t, k));

      tl.set("#f-fromnote", { opacity: 1 }, at(37.86));
      tl.fromTo("#f-fromnote", { scale: 1.4, rotation: -10 }, { scale: 1, rotation: -2, duration: 0.2, ease: "power4.out", immediateRender: false }, at(37.86));
      tl.to("#f-in", { borderColor: "#f97316", duration: 0.1 }, at(37.92));
      tl.set("#f-caret", { opacity: 1 }, at(37.92));
      q("#f-in i").forEach((c, i) => tl.set(c, { display: "inline" }, at(37.96 + i * 0.027)));
      tl.set("#f-caret", { opacity: 0 }, at(38.8));
      tl.to("#f-in", { borderColor: "#e4e4e7", duration: 0.2 }, at(38.8));

      // where she's starting · the hour she really has · the timeline
      tl.set("#f-segpill", { opacity: 1 }, at(38.95));
      tl.fromTo("#f-segpill", { scale: 0.85 }, { scale: 1, duration: 0.24, ease: "back.out(2.2)", immediateRender: false }, at(38.95));
      tl.to("#f-beg", { color: "#c2410c", duration: 0.1 }, at(38.95));
      pick("#f-hour", 39.75);
      pick("#f-years", 40.43);

      // she taps Create
      tl.to("#f-btn", { scale: 0.96, duration: 0.07, ease: "power2.out" }, at(40.86));
      tl.to("#f-btn", { scale: 1, duration: 0.24, ease: "back.out(2)" }, at(40.93));
      tl.set("#f-rip", { opacity: 1 }, at(40.86));
      tl.fromTo("#f-rip", { scale: 0 }, { scale: 9, duration: 0.45, ease: "power2.out", immediateRender: false }, at(40.86));
      tl.to("#f-rip", { opacity: 0, duration: 0.35, ease: "none" }, at(40.96));

      // ---------------------------------------------------------------- it turns three years into phases, milestones and tasks
      cutUp(capA, 41.28);
      tl.to("#f-form", { y: -230, duration: 0.34, ease: "power4.in" }, at(41.3));
      tl.to("#f-form", { opacity: 0, duration: 0.24, ease: "none" }, at(41.3));
      tl.set("#f-road", { opacity: 0.35, y: 230 }, at(41.64));
      tl.to("#f-road", { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" }, at(41.64));
      // skeletons sweep while it thinks
      tl.fromTo(".f-sk i", { x: -300 }, { x: 1000, duration: 0.55, ease: "power1.inOut", stagger: 0.05, immediateRender: false }, at(41.7));
      tl.fromTo(".f-sk i", { x: -300 }, { x: 1000, duration: 0.55, ease: "power1.inOut", stagger: 0.05, immediateRender: false }, at(42.2));

      const capB = q("#f-capB > span");
      [
        [41.95, "anchor"],
        [42.17, "word"],
        [42.5, "light"],
        [42.75, "anchor"],
        [43.36, "anchor"],
        [44.05, "light"],
        [44.27, "anchor"],
      ].forEach(([t, k], i) => arrive(capB[i], t, k));

      // phases cascade in on "phases"
      tl.to(".f-sk", { opacity: 0, duration: 0.12, ease: "none" }, at(42.72));
      q(".f-ph").forEach((el, i) => {
        tl.set(el, { opacity: 1 }, at(42.75 + i * 0.07));
        tl.fromTo(el, { y: 44 }, { y: 0, duration: 0.18, ease: "power4.out", immediateRender: false }, at(42.75 + i * 0.07));
      });
      // the first phase opens into its milestone on "milestones"; the rest make room
      gsap.set("#f-ms", { clipPath: "inset(0% 0% 100% 0%)" });
      tl.to("#f-ms", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power3.out" }, at(43.36));
      q(".f-ph").slice(1).forEach((el) => nudge(el, 43.36, "y", 414, 0.55));
      // and the milestone fills with tasks
      q(".f-task").forEach((el, i) => {
        tl.set(el, { opacity: 1 }, at(43.75 + i * 0.08));
        tl.fromTo(el, { y: 24 }, { y: 0, duration: 0.16, ease: "power4.out", immediateRender: false }, at(43.75 + i * 0.08));
      });

      tl.to(q(".f-task")[0], { borderColor: "#f97316", backgroundColor: "#fff7ed", duration: 0.15 }, at(44.27));
