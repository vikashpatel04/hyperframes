    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#s1", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#s4","#s5","#s6"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#s2", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#s3", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — zero→week (into the first hour) : zoom-through (cut @14.4)
      tl.to("#s1", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 14.19);
      tl.to("#s1", { autoAlpha: 0, duration: 0.21, ease: "none" }, 14.19);
      tl.set("#s1", { autoAlpha: 0 }, 14.4);
      tl.fromTo("#s2", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 14.4);
      
      // SEAM — week→goal (the mark arrives) : inverse zoom-through (cut @24.7)
      tl.to("#s2", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 24.49);
      tl.to("#s2", { autoAlpha: 0, duration: 0.21, ease: "none" }, 24.49);
      tl.set("#s2", { autoAlpha: 0 }, 24.7);
      tl.fromTo("#s3", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 24.7);
      
      // SEAM — goal→plan : cut-the-curve LEFT (cut @30.75)
      tl.to("#s3", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 30.41);
      tl.set("#s3", { autoAlpha: 0 }, 30.75);
      tl.fromTo("#s4", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 30.75);
      
      // SEAM — plan→adapt : cut-the-curve LEFT (cut @41.6)
      tl.to("#s4", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 41.26);
      tl.set("#s4", { autoAlpha: 0 }, 41.6);
      tl.fromTo("#s5", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 41.6);
      
      // SEAM — adapt→one (conclusion rises) : cut-the-curve UP (cut @51.95)
      tl.to("#s5", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 51.61);
      tl.set("#s5", { autoAlpha: 0 }, 51.95);
      tl.fromTo("#s6", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 51.95);
      
      // </seams:auto>

      // day floods out of the ring in s3 (complete by 26.9 s)
      tl.set("#ground", { backgroundColor: "#09090b" }, 0);
      tl.set("#ground", { backgroundColor: "#fafafa" }, 27.0);

      // Pad the root timeline to the film's full length.
      tl.set({}, {}, 64);
