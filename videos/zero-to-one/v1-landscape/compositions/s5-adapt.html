    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => [...document.querySelectorAll(s)];

      const X = (d) => d * COL + 12;
      const Y = (k) => 84 + k * 82;

      // the week as planned: one block a day, Mon/Tue done

      me.innerHTML = [...me.textContent].map((c) => `<i>${c === " " ? "&nbsp;" : c}</i>`).join("");

      function waterfall(els, t, opts = {}) {
        let gap = opts.gap ?? 0.09;
        els.forEach((el, i) => {
          const y = i === 0 ? (opts.y0 ?? 80) : (opts.y ?? 50);
          tl.set(el, { opacity: 1, y }, t);
          tl.to(el, { y: 0, duration: i === 0 ? 0.2 : 0.16, ease: "power4.out" }, t);
          t += gap;
          gap *= 0.84;
        });
      }

      // ---- Miss a day? ----
      waterfall(q("#s5-h1 span"), 0.22, { y0: 70, y: 60, gap: 0.22 });
      tl.to("#s5-wed", { borderColor: "#ef4444", duration: 0.2 }, 0.7);

      [5, 4, 3, 2].forEach((d, i) => {
        const t = 1.82 + i * 0.07;
        const x0 = X(d);
        // nudge curve: ramp 10% / burst 65% / long settle, with a small lift over the gap

        tl.to("#s5-c" + d, { x: x0 + 185, duration: 0.09, ease: "none" }, t + 0.1);
        tl.to("#s5-c" + d, { x: X(d + 1), duration: 0.32, ease: "power4.out" }, t + 0.19);
        tl.to("#s5-c" + d, { y: Y(0) - 22, duration: 0.19, ease: "power2.out" }, t);
        tl.to("#s5-c" + d, { y: Y(0), duration: 0.32, ease: "power2.inOut" }, t + 0.19);

      tl.to("#s5-rest", { opacity: 0, duration: 0.2 }, 1.85);
      tl.to("#s5-wed", { borderColor: "#e4e4e7", duration: 0.3 }, 2.1);

      tl.fromTo("#s5-toast", { opacity: 1, y: 140 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, 2.5);
      q("#s5-h1 span").forEach((el, i) => {
        tl.to(el, { x: -230, duration: 0.34, ease: "power4.in" }, 2.35 + i * 0.022);
        tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.35 + i * 0.022);
      });
      let off = 0,
        g = 0.06;
      q("#s5-h2 span").forEach((el) => {
        tl.fromTo(el, { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 2.69 + off);
        off += g;
        g *= 0.84;
      });

      // ---- the assistant slides in; the week steps aside (nudge curve) ----
      tl.to("#s5-toast", { opacity: 0, y: 60, duration: 0.2, ease: "power3.in" }, 3.75);
      tl.to("#s5-h2", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 3.8);
      tl.to("#s5-week", { scale: 0.92, y: 14, duration: 0.12, ease: "power3.in" }, 3.9);
      tl.to("#s5-week", { scale: 0.66, y: 100, duration: 0.11, ease: "none" }, 4.02);
      tl.to("#s5-week", { scale: 0.6, y: 120, duration: 0.42, ease: "power4.out" }, 4.13);
      tl.to("#s5-sheet", { x: 0, duration: 0.55, ease: "expo.out" }, 3.95);

      // "I only have 30 minutes today."
      tl.set("#s5-me", { opacity: 1 }, 4.55);
      q("#s5-me i").forEach((c, i) => tl.set(c, { display: "inline" }, 4.55 + i * 0.02));
      // explains
      tl.set("#s5-ai", { opacity: 1 }, 5.25);
      q("#s5-ai span").forEach((w, i) => tl.to(w, { opacity: 1, duration: 0.08 }, 5.28 + i * 0.055));

      tl.fromTo("#s5-sug", { opacity: 1, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 6.02);

      tl.fromTo("#s5-cursor", { opacity: 1, x: 1960, y: 1100 }, { opacity: 1, x: 1519, y: 649, duration: 0.6, ease: "power3.out", immediateRender: false }, 6.95);
      tl.to("#s5-cursor", { scale: 0.88, duration: 0.06, ease: "power2.in" }, 7.66);
