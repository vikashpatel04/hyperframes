      const pctAt = [0, 0.75, 1.05, 1.3, 1.55, 1.8, 2.05, 2.35, 2.75];

        if (!i) return;
        tl.set(pct[i - 1], { opacity: 0 }, 0.4 + pctAt[i]);
        tl.set(p, { opacity: 1 }, 0.4 + pctAt[i]);
      });
      q(".s6-fill").forEach((f, i) => tl.to(f, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.45 + i * 0.62));
