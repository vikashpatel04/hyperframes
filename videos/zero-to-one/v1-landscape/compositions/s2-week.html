    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => [...document.querySelectorAll(s)];
      const COL = 246;
      const slotY = (k) => 84 + k * 82;
      const slotX = (d) => d * COL + 12;

      // the plan's resting places
      const plan = q(".s2-chip.plan");
      const slot = plan.map((c, i) => ({ d: +c.dataset.day, k: i % 2 }));
      plan.forEach((c, i) => gsap.set(c, { x: slotX(slot[i].d), y: slotY(slot[i].k) }));
      const extra = q(".s2-chip.extra");
      extra.forEach((c) => gsap.set(c, { x: slotX(4), y: slotY(2) }));
      q(".strike").forEach((s) => gsap.set(s, { scaleX: 0 }));

      // header day name rolls: Sunday → Wednesday → Friday
      const days = q("#s2-day span");
      [0.95, 2.55, 4.15].forEach((t, i) => {
        if (i) tl.to(days[i - 1], { opacity: 0, y: -40, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, t - 0.1);
        tl.fromTo(days[i], { opacity: 0, y: 60, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "power4.out", immediateRender: false }, t);
      });
      tl.to(days[2], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.9);

      // ---- Sunday: the plan deals itself out of Sunday into the week ----
      tl.to("#s2-sun", { borderColor: "#71717a", duration: 0.2 }, 0.7);
      plan.forEach((c, i) => {
        const t = 0.75 + i * 0.055;
        tl.fromTo(c, { opacity: 1, x: slotX(6), y: slotY(0) }, { opacity: 1, x: slotX(slot[i].d), y: slotY(slot[i].k), duration: 0.42, ease: "expo.out", immediateRender: false }, t);
      });

      // ---- Wednesday: missed ----
      tl.to("#s2-wed", { borderColor: "#ef4444", backgroundColor: "#1c1213", duration: 0.2 }, 2.62);
      tl.fromTo("#s2-wed .s2-missed", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, 2.66);
      q(".s2-chip.wed .strike").forEach((s, i) => tl.to(s, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 2.78 + i * 0.1));
      q(".s2-chip.wed").forEach((c) => tl.to(c, { color: "#71717a", duration: 0.2 }, 2.8));

      // ---- by Friday: it all piles forward ----
      const wed = q(".s2-chip.wed");
      wed.forEach((c, i) => tl.to(c, { x: slotX(3), y: slotY(2 + i), rotation: i ? -3 : 2, duration: 0.4, ease: "power3.inOut" }, 3.55 + i * 0.08));
      extra.forEach((c, i) => {
        const t = 3.95 + i * 0.1;
        tl.fromTo(c, { opacity: 1, x: slotX(3), y: slotY(3) }, { opacity: 1, x: slotX(4) + (i % 2 ? 6 : -6), y: slotY(2 + i), rotation: [3, -4, 6, -7, 9, -11][i], duration: 0.35, ease: "power3.out", immediateRender: false }, t);
      });

      // ---- gone: the week topples out of frame ----
      const all = [...extra.slice().reverse(), ...plan.filter((c, i) => slot[i].d >= 3).reverse(), ...plan.filter((c, i) => slot[i].d < 3)];
      all.forEach((c, i) => {
        tl.to(c, { y: "+=900", rotation: [24, -32, 40, -18, 28, -36][i % 6], duration: 0.7, ease: "power3.in" }, 4.85 + i * 0.025);
      });
      tl.to(".s2-card", { opacity: 0.25, duration: 0.5, ease: "power2.in" }, 5.2);

      const knowAt = [6.56, 6.95, 7.18, 7.37, 7.7, 8.5, 8.82, 8.98, 9.1, 9.28];
      q("#s2-know span").forEach((el, i) => {
        const to = el.classList.contains("mute") ? "#71717a" : "#fafafa";
        tl.set(el, { opacity: 1, color: "#27272a" }, knowAt[i]);
        tl.to(el, { color: to, duration: 0.18, ease: "power2.out" }, knowAt[i]);
      });

      window.__timelines["s2"] = tl;
