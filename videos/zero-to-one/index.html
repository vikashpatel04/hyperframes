<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0 to 1 — The Note (hook + Act 1 review)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #e2cdac;
      }
      /* Opaque stage ground: the sunlit wall colour, so nothing ever composites over white. */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #e2cdac;
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.6" data-width="1080" data-height="1920">
      <div
        id="s1"
        class="scene-host"
        data-composition-id="s1"
        data-composition-src="compositions/s1-desk.html"
        data-start="0"
        data-duration="19.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- narrator (Kokoro af_heart, deadpan); stops before Act 2's first line at 19.4 -->
      <audio id="vo" class="clip" src="assets/voice/narration.wav" data-start="0" data-duration="19.3" data-track-index="10" data-volume="1"></audio>
      <!-- every effect and the room-tone bed, frame-placed by scripts/build-sfx.py -->
      <audio id="sfx" class="clip" src="assets/sfx/hook-act1.wav" data-start="0" data-duration="19.6" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
